<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>iMessage - IMSG</title>

  <!-- Configurações para PWA (Instalação como APP/APK) -->
  <meta name="theme-color" content="#f2f2f7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IMSG">

  <!-- Manifest Dinâmico via Data URL -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "IMSG - Messages",
    "short_name": "IMSG",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#ffffff",
    "theme_color": "#007aff",
    "icons": [
      {
        "src": "https://cdn-icons-png.flaticon.com/512/1041/1041916.png",
        "sizes": "192x192",
        "type": "image/png"
      },
      {
        "src": "https://cdn-icons-png.flaticon.com/512/1041/1041916.png",
        "sizes": "512x512",
        "type": "image/png"
      }
    ]
  }'>

  <style>
    /* Estilo do iOS / System Fonts */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f2f2f7;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    html {
      height: -webkit-fill-available;
    }

    #app {
      width: 100%;
      height: 100vh;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    /* Adaptação Responsiva para Desktop */
    @media (min-width: 768px) {
      body {
        padding: 20px;
        background-color: #e5e5ea;
      }
      #app {
        max-width: 900px;
        height: 85vh;
        border-radius: 18px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
    }

    .hidden {
      display: none !important;
    }

    /* Banner de Instalação (Estilo Notificação iOS) */
    #install-banner {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid #e5e5ea;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #1c1c1e;
      z-index: 100;
    }

    #install-banner button {
      background: #007aff;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Tela de Login (Modal iOS) */
    #login-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: #ffffff;
    }

    .login-card {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .app-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(180deg, #34c759 0%, #28cd41 100%);
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
      margin-bottom: 8px;
    }

    .app-icon svg {
      width: 44px;
      height: 44px;
      fill: #ffffff;
    }

    .login-card h2 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .login-card input {
      width: 100%;
      background: #e9e9eb;
      border: none;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      color: #000;
    }

    .login-card button {
      width: 100%;
      background: #007aff;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .login-card button:active {
      opacity: 0.7;
    }

    /* Tela do Chat */
    #chat-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #ffffff;
    }

    /* Header Estilo Navigation Bar iOS */
    #chat-header {
      padding: 12px 16px;
      background: rgba(249, 249, 249, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    #chat-header .channel-title {
      font-size: 15px;
      font-weight: 600;
      color: #000000;
    }

    #chat-header .user-info {
      font-size: 11px;
      color: #8e8e93;
      margin-top: 2px;
    }

    /* Área de Mensagens */
    #messages-log {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #ffffff;
    }

    /* Estilo das Bolhas (iOS Message Bubbles) */
    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .msg-wrapper.me {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-wrapper.other {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-author {
      font-size: 11px;
      color: #8e8e93;
      margin-bottom: 3px;
      margin-left: 12px;
    }

    .bubble {
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.35;
      word-break: break-word;
      position: relative;
    }

    /* Balão enviado pelo usuário (Azul iOS) */
    .msg-wrapper.me .bubble {
      background: #007aff;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    /* Balão recebido (Cinza iOS) */
    .msg-wrapper.other .bubble {
      background: #e9e9eb;
      color: #000000;
      border-bottom-left-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      margin-top: 4px;
      color: #8e8e93;
      padding: 0 4px;
    }

    /* Mensagem do Sistema */
    .msg-system {
      align-self: center;
      font-size: 12px;
      color: #8e8e93;
      margin: 8px 0;
      font-weight: 500;
    }

    /* Campo de Entrada (Input Bar iOS) */
    #message-form {
      padding: 8px 12px;
      background: rgba(249, 249, 249, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #message-input {
      flex: 1;
      background: #ffffff;
      border: 1px solid #d1d1d6;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 16px;
      outline: none;
      color: #000;
    }

    #message-input:focus {
      border-color: #007aff;
    }

    #message-form button {
      background: #007aff;
      color: #ffffff;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    #message-form button:active {
      transform: scale(0.92);
      opacity: 0.8;
    }

    #message-form button svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Banner de Instalação PWA -->
    <div id="install-banner" class="hidden">
      <span>Instalar o IMSG no seu dispositivo?</span>
      <button id="install-btn">Instalar</button>
    </div>

    <!-- Tela de Login -->
    <div id="login-screen">
      <div class="login-card">
        <div class="app-icon">
          <svg viewBox="0 0 24 24">
            <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
          </svg>
        </div>
        <h2>IMSG Messages</h2>
        <input type="text" id="username-input" placeholder="Seu Nome / Apelido" maxlength="15" autocomplete="off">
        <button id="join-btn">Entrar</button>
      </div>
    </div>

    <!-- Tela do Chat -->
    <div id="chat-screen" class="hidden">
      <div id="chat-header">
        <span class="channel-title">#geral</span>
        <span class="user-info" id="user-display"></span>
      </div>
      <div id="messages-log"></div>
      <form id="message-form">
        <input type="text" id="message-input" placeholder="iMessage" autocomplete="off">
        <button type="submit">
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Firebase SDKs e Lógica do App -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBGFNnKz5_SvfhZb7_mgLTahZ4-yKq3nKs",
      authDomain: "imsg-570c2.firebaseapp.com",
      databaseURL: "https://imsg-570c2-default-rtdb.firebaseio.com",
      projectId: "imsg-570c2",
      storageBucket: "imsg-570c2.firebasestorage.app",
      messagingSenderId: "469002794631",
      appId: "1:469002794631:web:780d2a80b1dc3105d6aa22",
      measurementId: "G-NS1WD6Y296"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let username = "";

    const loginScreen = document.getElementById("login-screen");
    const chatScreen = document.getElementById("chat-screen");
    const usernameInput = document.getElementById("username-input");
    const joinBtn = document.getElementById("join-btn");
    const userDisplay = document.getElementById("user-display");
    const messagesLog = document.getElementById("messages-log");
    const messageForm = document.getElementById("message-form");
    const messageInput = document.getElementById("message-input");

    joinBtn.addEventListener("click", joinChat);
    usernameInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") joinChat();
    });

    function joinChat() {
      const val = usernameInput.value.trim();
      if (val) {
        username = val;
        userDisplay.textContent = `Conectado como ${username}`;
        loginScreen.classList.add("hidden");
        chatScreen.classList.remove("hidden");
        
        sendMessage("entrou na conversa.", true);
        listenForMessages();
      }
    }

    messageForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (text) {
        sendMessage(text, false);
        messageInput.value = "";
      }
    });

    function sendMessage(text, isSystem = false) {
      const messagesRef = ref(db, "chat_geral");
      push(messagesRef, {
        user: username,
        text: text,
        isSystem: isSystem,
        timestamp: serverTimestamp()
      });
    }

    function listenForMessages() {
      const messagesRef = ref(db, "chat_geral");
      
      onChildAdded(messagesRef, (snapshot) => {
        const data = snapshot.val();
        renderMessage(data);
      });
    }

    function renderMessage(data) {
      const date = data.timestamp ? new Date(data.timestamp) : new Date();
      const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (data.isSystem) {
        const sysDiv = document.createElement("div");
        sysDiv.classList.add("msg-system");
        sysDiv.textContent = `${data.user} ${data.text}`;
        messagesLog.appendChild(sysDiv);
      } else {
        const isMe = data.user === username;
        const wrapper = document.createElement("div");
        wrapper.classList.add("msg-wrapper", isMe ? "me" : "other");

        let authorHtml = !isMe ? `<div class="msg-author">${escapeHtml(data.user)}</div>` : '';

        wrapper.innerHTML = `
          ${authorHtml}
          <div class="bubble">${escapeHtml(data.text)}</div>
          <div class="msg-time">${timeStr}</div>
        `;

        messagesLog.appendChild(wrapper);
      }

      messagesLog.scrollTop = messagesLog.scrollHeight;
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
    }

    // REGISTRO DE SERVICE WORKER & PWA
    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBanner.classList.add('hidden');
        }
        deferredPrompt = null;
      }
    });

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      const swUrl = URL.createObjectURL(blob);
      
      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW Erro:', err));
    }
  </script>
</body>
</html>
