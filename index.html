<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>IMSG Messenger</title>

  <link rel="manifest" href="./manifest.json">

  <meta name="theme-color" content="#007aff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IMSG Messenger">

  <link rel="apple-touch-icon"
    href="https://cdn-icons-png.flaticon.com/512/1041/1041916.png">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Verdana, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --msn-blue: #0066cc;
      --msn-blue-dark: #004a99;
      --msn-blue-light: #dcecff;
      --msn-green: #009900;
      --msn-bg: #eef5fb;
      --msn-panel: #ffffff;
      --msn-border: #8aa9c7;
      --msn-text: #222;
      --msn-muted: #666;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background:
        linear-gradient(
          180deg,
          #dcebf8 0,
          #eef5fb 45%,
          #d6e6f4 100%
        );

      color: var(--msn-text);

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    button,
    input,
    select {
      font-family: Tahoma, Verdana, Arial, sans-serif;
    }

    .hidden {
      display: none !important;
    }

    #app {
      width: 100%;
      height: 100vh;

      display: flex;
      flex-direction: column;

      background: #fff;

      position: relative;
      overflow: hidden;
    }

    @media (min-width: 768px) {

      body {
        padding: 24px;
      }

      #app {
        width: 100%;
        max-width: 900px;
        height: 88vh;
        min-height: 560px;

        border: 1px solid #6f91b1;

        box-shadow:
          0 4px 18px rgba(0, 60, 110, .28);
      }
    }

    /* =====================================================
       INSTALAÇÃO
       ===================================================== */

    #install-banner {
      background:
        linear-gradient(#4a9ee8, #1266ad);

      color: white;

      padding: 7px 10px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 11px;
      font-weight: bold;

      border-bottom: 1px solid #064b87;

      z-index: 999;
    }

    #install-banner button {
      background:
        linear-gradient(#fff, #dcecff);

      color: #07599e;

      border: 1px solid #7198bb;

      padding: 3px 12px;

      border-radius: 3px;

      font-size: 11px;
      font-weight: bold;
    }

    /* =====================================================
       LOGIN
       ===================================================== */

    #login-screen {
      flex: 1;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 50% 20%,
          #fff 0,
          #f5f9fd 38%,
          #dcebf8 100%
        );
    }

    .login-card {
      width: 100%;
      max-width: 330px;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 10px;

      padding: 24px 28px;

      background:
        linear-gradient(#fff, #edf5fc);

      border: 1px solid #9bb5ce;

      box-shadow:
        0 2px 9px rgba(0, 60, 110, .22);
    }

    .app-icon {
      width: 72px;
      height: 72px;

      background:
        linear-gradient(135deg, #7fd45a, #188f1c);

      border: 2px solid #fff;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      box-shadow:
        0 1px 4px rgba(0, 0, 0, .35);
    }

    .app-icon svg {
      width: 40px;
      height: 40px;
      fill: white;
    }

    .login-card h2 {
      font-size: 21px;
      color: #174f7e;
      text-shadow: 0 1px #fff;
    }

    .login-card input {
      width: 100%;

      background: white;

      border: 1px solid #8fa9c0;

      padding: 7px 9px;

      border-radius: 2px;

      font-size: 12px;

      outline: none;

      box-shadow:
        inset 1px 1px 2px rgba(0, 0, 0, .08);
    }

    .login-card input:focus {
      border-color: #3b8dcc;
    }

    .login-card button {
      width: 100%;

      background:
        linear-gradient(#72bd52, #238c20);

      color: white;

      border: 1px solid #287320;

      padding: 7px;

      border-radius: 3px;

      font-size: 12px;
      font-weight: bold;

      cursor: pointer;
    }

    /* =====================================================
       CHAT
       ===================================================== */

    #chat-screen {
      height: 100%;

      display: flex;
      flex-direction: column;

      background: white;
    }

    #chat-header {
      min-height: 54px;

      padding: 6px 9px;

      background:
        linear-gradient(
          180deg,
          #72b5eb 0%,
          #2f87cf 45%,
          #0b62ad 100%
        );

      border-bottom: 1px solid #06477f;

      display: flex;
      align-items: center;

      position: relative;

      box-shadow:
        inset 0 1px rgba(255, 255, 255, .45);

      z-index: 20;
    }

    .header-center {
      flex: 1;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;
    }

    .channel-select {
      background: transparent;

      border: none;

      color: white;

      font-size: 13px;
      font-weight: bold;

      text-align-last: center;

      text-shadow:
        0 1px #174f7e;
    }

    .user-info {
      color: #e8f4ff;
      font-size: 10px;
    }

    .logout-btn {
      background:
        linear-gradient(#fff, #dbeaf7);

      border: 1px solid #5d88ae;

      color: #1a5786;

      font-size: 10px;
      font-weight: bold;

      padding: 3px 8px;

      border-radius: 2px;

      cursor: pointer;
    }

    .header-actions {
      display: flex;
      gap: 3px;
    }

    .btn-icon {
      background:
        linear-gradient(#fff, #d7e8f6);

      border: 1px solid #5c87aa;

      color: #1664a0;

      display: flex;
      justify-content: center;
      align-items: center;

      cursor: pointer;

      padding: 4px;

      border-radius: 2px;
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;

      fill: #1268a8;
    }

    .btn-icon.recording svg {
      fill: #d00000;

      animation: pulse 1s infinite;
    }

    @keyframes pulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
      }

    }

    /* =====================================================
       ÁREA PRINCIPAL
       ===================================================== */

    #main-area {
      flex: 1;

      min-height: 0;

      display: flex;
      overflow: hidden;
    }

    /* =====================================================
       PAINEL DE USUÁRIOS
       ===================================================== */

    #users-panel {
      width: 185px;

      flex-shrink: 0;

      background:
        linear-gradient(
          180deg,
          #f7fbff,
          #e4eef7
        );

      border-right: 1px solid #9db5ca;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    .users-title {
      padding: 7px 9px;

      background:
        linear-gradient(
          #d8eafa,
          #b8d3e9
        );

      border-bottom: 1px solid #9ab3c8;

      color: #174f7e;

      font-size: 11px;
      font-weight: bold;
    }

    #users-list {
      flex: 1;

      overflow-y: auto;

      padding: 4px;
    }

    .user-item {
      display: flex;
      align-items: center;

      gap: 7px;

      padding: 6px 5px;

      border: 1px solid transparent;

      cursor: pointer;

      font-size: 11px;

      border-radius: 2px;
    }

    .user-item:hover {
      background: #e1f0ff;

      border-color: #b7d1e7;
    }

    .user-item.selected {
      background:
        linear-gradient(
          #d9edff,
          #bcdcff
        );

      border-color: #8eb7da;
    }

    .status-dot {
      width: 9px;
      height: 9px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #999;

      border: 1px solid #777;
    }

    .status-dot.online {
      background: #45b83c;
      border-color: #278323;
      box-shadow: 0 0 2px #55d84b;
    }

    .user-name {
      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .me-user {
      font-weight: bold;
      color: #175e96;
    }

    /* =====================================================
       CHAT MENSAGENS
       ===================================================== */

    #chat-column {
      flex: 1;

      min-width: 0;

      display: flex;
      flex-direction: column;
    }

    #conversation-title {
      min-height: 31px;

      display: flex;
      align-items: center;

      padding: 5px 9px;

      background:
        linear-gradient(
          #f9fcff,
          #e7f0f7
        );

      border-bottom: 1px solid #c1d2e1;

      color: #175e96;

      font-size: 11px;
      font-weight: bold;
    }

    #messages-log {
      flex: 1;

      min-height: 0;

      padding: 10px 12px;

      overflow-y: auto;

      display: flex;
      flex-direction: column;

      gap: 5px;

      background:
        linear-gradient(
          180deg,
          #fff,
          #f8fbfe
        );
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;

      max-width: 82%;

      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-wrapper.me {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-author {
      font-size: 11px;

      color: #1765a0;

      margin-bottom: 1px;
      margin-left: 3px;

      font-weight: bold;
    }

    .bubble {
      padding: 5px 8px;

      border-radius: 3px;

      border: 1px solid #c1cfdb;

      font-size: 12px;

      line-height: 1.35;

      word-break: break-word;

      box-shadow:
        0 1px 1px rgba(0, 0, 0, .04);
    }

    .msg-wrapper.me .bubble {
      background:
        linear-gradient(
          #e9f6ff,
          #d6edff
        );

      color: #173b56;

      border-color: #9fc6e3;
    }

    .msg-wrapper.other .bubble {
      background:
        linear-gradient(
          #fff,
          #f0f0f0
        );

      color: #222;

      border-color: #c5c5c5;
    }

    .msg-time {
      font-size: 9px;

      color: #777;

      padding: 0 3px;
    }

    .msg-system {
      align-self: center;

      font-size: 10px;

      color: #777;

      margin: 5px 0;

      font-style: italic;
    }

    .chat-img {
      max-width: 100%;

      border-radius: 2px;

      border: 1px solid #9aaec0;

      cursor: pointer;
    }

    .chat-audio {
      max-width: 210px;
      height: 32px;
    }

    .typing-indicator {
      font-size: 10px;

      font-style: italic;

      color: #666;

      padding-left: 12px;

      height: 14px;
    }

    /* =====================================================
       BARRA DE MENSAGEM
       ===================================================== */

    #message-form {
      padding: 6px 8px;

      padding-bottom:
        max(6px, env(safe-area-inset-bottom));

      background:
        linear-gradient(
          #e8f1f8,
          #d2e2ef
        );

      border-top: 1px solid #8ea8be;

      display: flex;

      align-items: center;

      gap: 4px;
    }

    #message-input {
      flex: 1;

      min-width: 0;

      background: white;

      border: 1px solid #8ca5bb;

      padding: 6px 8px;

      border-radius: 2px;

      font-size: 12px;

      outline: none;
    }

    #send-btn {
      width: 30px;
      height: 28px;

      background:
        linear-gradient(
          #79c85d,
          #238d20
        );

      color: white;

      border: 1px solid #26751f;

      border-radius: 3px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    #send-btn svg {
      width: 15px;
      height: 15px;
      fill: white;
    }

    #file-input {
      display: none;
    }

    /* =====================================================
       MODAL DE CHAMADA
       ===================================================== */

    #call-modal {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      background:
        rgba(20, 70, 110, .97);

      backdrop-filter: blur(8px);

      z-index: 1000;

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      align-items: center;

      padding: 28px 20px;
    }

    .call-status {
      color: white;

      text-align: center;
    }

    .call-status h3 {
      font-size: 18px;
    }

    .call-status p {
      font-size: 11px;

      color: #dceeff;

      margin-top: 4px;
    }

    .video-container {
      position: relative;

      width: 100%;

      max-width: 480px;

      height: 60vh;

      border: 2px solid #8cb6d7;

      border-radius: 3px;

      overflow: hidden;

      background: #102b40;

      display: flex;

      justify-content: center;
      align-items: center;
    }

    #remote-video {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    #local-video {
      position: absolute;

      bottom: 10px;
      right: 10px;

      width: 100px;
      height: 140px;

      border-radius: 2px;

      object-fit: cover;

      border: 2px solid white;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, .5);
    }

    .call-controls {
      display: flex;

      gap: 14px;
    }

    .call-btn {
      width: 52px;
      height: 52px;

      border-radius: 50%;

      border: 2px solid white;

      display: flex;

      justify-content: center;
      align-items: center;

      cursor: pointer;
    }

    .call-btn.accept {
      background: #269d35;
    }

    .call-btn.end {
      background: #c83232;
    }

    .call-btn svg {
      width: 24px;
      height: 24px;

      fill: white;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      #users-panel {
        width: 125px;
      }

      .user-item {
        font-size: 10px;
      }

      .header-actions {
        gap: 1px;
      }

      .btn-icon {
        padding: 3px;
      }

      .btn-icon svg {
        width: 16px;
        height: 16px;
      }

    }

  </style>
</head>

<body>

<div id="app">

  <!-- ===================================================
       LOGIN
       =================================================== -->

  <div id="login-screen">

    <div class="login-card">

      <div class="app-icon">

        <svg viewBox="0 0 24 24">

          <path
            d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z" />

        </svg>

      </div>

      <h2>IMSG Messenger</h2>

      <input
        type="text"
        id="username-input"
        placeholder="Seu Nome / Apelido"
        maxlength="20"
        autocomplete="off">

      <button id="join-btn">
        Entrar
      </button>

    </div>

  </div>


  <!-- ===================================================
       CHAT
       =================================================== -->

  <div id="chat-screen" class="hidden">

    <div id="chat-header">

      <button
        id="logout-btn"
        class="logout-btn">
        Sair
      </button>

      <div class="header-center">

        <select
          id="channel-select"
          class="channel-select">

          <option value="geral">#geral</option>
          <option value="jogos">#jogos</option>
          <option value="musica">#musica</option>
          <option value="random">#random</option>

        </select>

        <span
          class="user-info"
          id="user-display">
        </span>

      </div>

      <div class="header-actions">

        <button
          id="btn-start-audio-call"
          class="btn-icon"
          title="Chamada de Áudio">

          <svg viewBox="0 0 24 24">

            <path
              d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C8.61 21 1 13.39 1 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02z" />

          </svg>

        </button>

        <button
          id="btn-start-video-call"
          class="btn-icon"
          title="Chamada de Vídeo">

          <svg viewBox="0 0 24 24">

            <path
              d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z" />

          </svg>

        </button>

      </div>

    </div>


    <!-- =================================================
         ÁREA PRINCIPAL
         ================================================= -->

    <div id="main-area">


      <!-- USUÁRIOS -->

      <aside id="users-panel">

        <div class="users-title">
          Contatos
        </div>

        <div id="users-list"></div>

      </aside>


      <!-- CONVERSA -->

      <div id="chat-column">

        <div id="conversation-title">
          Conversa: #geral
        </div>

        <div id="messages-log"></div>

        <div
          id="typing-indicator"
          class="typing-indicator hidden">
        </div>


        <form id="message-form">

          <input
            type="file"
            id="file-input"
            accept="image/*">


          <button
            type="button"
            id="img-btn"
            class="btn-icon"
            title="Enviar Imagem">

            <svg viewBox="0 0 24 24">

              <path
                d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-2 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" />

            </svg>

          </button>


          <button
            type="button"
            id="audio-btn"
            class="btn-icon"
            title="Gravar Áudio">

            <svg viewBox="0 0 24 24">

              <path
                d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />

            </svg>

          </button>


          <input
            type="text"
            id="message-input"
            placeholder="Digite uma mensagem..."
            autocomplete="off">


          <button
            type="submit"
            id="send-btn">

            <svg viewBox="0 0 24 24">

              <path
                d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />

            </svg>

          </button>

        </form>

      </div>

    </div>

  </div>


  <!-- ===================================================
       MODAL DE CHAMADA
       =================================================== -->

  <div
    id="call-modal"
    class="hidden">

    <div class="call-status">

      <h3 id="call-peer-name">
        IMSG
      </h3>

      <p id="call-state-text">
        Conectando...
      </p>

    </div>


    <div class="video-container">

      <video
        id="remote-video"
        autoplay
        playsinline>
      </video>

      <video
        id="local-video"
        autoplay
        playsinline
        muted>
      </video>

    </div>


    <div class="call-controls">

      <button
        id="btn-accept-call"
        class="call-btn accept hidden"
        title="Atender">

        <svg viewBox="0 0 24 24">

          <path
            d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C8.61 21 1 13.39 1 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02z" />

        </svg>

      </button>


      <button
        id="btn-end-call"
        class="call-btn end"
        title="Encerrar">

        <svg viewBox="0 0 24 24">

          <path
            d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z" />

        </svg>

      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     FIREBASE
     ===================================================== -->

<script type="module">

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


  import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    onValue,
    off,
    set,
    remove,
    serverTimestamp,

    update
  } from

  /* =====================================================
     FIREBASE CONFIG
     ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBGFNnKz5_SvfhZb7_mgLTahZ4-yKq3nKs",

    authDomain:

    databaseURL:

  function playPopSound() {

    try {

      const ctx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

      const osc =
        ctx.createOscillator();

      const gain =
        ctx.createGain();

      osc.type =
        "sine";

      osc.frequency.setValueAtTime(
        600,
        ctx.currentTime
      );

      osc.frequency.exponentialRampToValueAtTime(
        800,
        ctx.currentTime + .08
      );

      gain.gain.setValueAtTime(
        .1,
        ctx.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        .01,
        ctx.currentTime + .08
      );

      osc.connect(gain);

      gain.connect(ctx.destination);

      osc.start();

      osc.stop(
        ctx.currentTime + .08
      );

    } catch (e) {}

  }

  function listenUsers() {

    activePresenceRef =
      ref(db, "presence");


    onValue(
      activePresenceRef,
      snapshot => {

        const data =
          snapshot.val() || {};

        usersList.innerHTML = "";


        const users =
          Object.values(data);


        users.sort(
          (a, b) =>
            String(a.name)
              .localeCompare(
                String(b.name)
              )
        );


        /*
         * Sempre mostra o próprio usuário
         */

        let foundMe =
          false;


        users.forEach(
          user => {

            if (
              !user ||
              !user.name
            )
              return;


            if (
              user.name === username
            )
              foundMe = true;


            addUserToList(
              user.name,
              user.name === username
            );

          }
        );


        if (!foundMe) {

          addUserToList(
            username,
            true
          );

        }

      }
    );

  }

         * O chat NÃO PROCESSA MAIS
         * eventos WebRTC.
         *
         * Portanto uma oferta antiga
         * jamais abrirá uma chamada.
         */

        if (
          data.type === "webrtc-offer" ||
          data.type === "webrtc-answer" ||
          data.type === "webrtc-candidate"
        ) {

          return;

        }


        renderMessage(data);


        if (
          !initialLoad &&
          !data.isSystem &&
          data.user !== username

          playPopSound();

    );


    setTimeout(
      () => {

  /* =====================================================

  function renderMessage(data) {

    const date =
      data.timestamp
        ? new Date(data.timestamp)
        : new Date();


    const time =
      date.toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );


    if (data.isSystem) {

      const div =
        document.createElement("div");

      div.className =
        "msg-system";


      div.textContent =
        `${data.user} ${data.text}`;


      messagesLog.appendChild(div);

    } else {

      const isMe =
        data.user === username;


      const wrapper =
        document.createElement("div");


      wrapper.className =
        "msg-wrapper " +
        (isMe ? "me" : "other");


      if (!isMe) {

        const author =
          document.createElement("div");

        author.className =
          "msg-author";

        author.textContent =
          data.user;

        wrapper.appendChild(author);

      }


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";


      if (
        data.type === "image"
      ) {

        const img =
          document.createElement("img");

        img.src =
          data.text;

        img.className =
          "chat-img";

        img.onclick =
          () => window.open(
            img.src,
            "_blank"
          );

        bubble.appendChild(img);

      }

      else if (
        data.type === "audio"
      ) {

        const audio =
          document.createElement("audio");

        audio.controls =
          true;

        audio.src =
          data.text;

        audio.className =
          "chat-audio";

        bubble.appendChild(audio);

      }

      else {

        bubble.textContent =
          data.text;

      }


      wrapper.appendChild(
        bubble
      );


      const timeDiv =
        document.createElement("div");

      timeDiv.className =
        "msg-time";

      timeDiv.textContent =
        time;


      wrapper.appendChild(
        timeDiv
      );


      messagesLog.appendChild(
        wrapper
      );

    }


    messagesLog.scrollTop =
      messagesLog.scrollHeight;

  }

  let mediaRecorder =
    null;

  let audioChunks =
    [];

  let isRecording =
    false;


  audioBtn.addEventListener(
    "click",
    async () => {

      if (!isRecording) {

        try {

          const stream =
            await navigator.mediaDevices
              .getUserMedia({
                audio: true
              });


          mediaRecorder =
            new MediaRecorder(
              stream
            );


          audioChunks =
            [];


          mediaRecorder.ondataavailable =
            event => {

              if (
                event.data.size > 0
              ) {

                audioChunks.push(
                  event.data
                );

              }

            };


          mediaRecorder.onstop =
            () => {

              const blob =
                new Blob(
                  audioChunks,
                  {
                    type:
                      "audio/webm"
                  }
                );


              const reader =
                new FileReader();


              reader.onloadend =
                () => {

                  sendMessage(
                    reader.result,
                    false,
                    "audio"
                  );

                };


              reader.readAsDataURL(
                blob
              );


              stream
                .getTracks()
                .forEach(
                  track =>
                    track.stop()
                );

            };


          mediaRecorder.start();

          isRecording =
            true;


          audioBtn
            .classList
            .add("recording");

        }

        catch (error) {

          alert(
            "Não foi possível acessar o microfone."
          );

        }

      }

      else {

        mediaRecorder.stop();

        isRecording =
          false;

        audioBtn
          .classList
          .remove("recording");

      }

    }
  );

  /* =====================================================
     INICIAR CHAMADA
     ===================================================== */

  async function startCall(
    hasVideo
  ) {

    if (!selectedUser) {

      alert(
        "Selecione um usuário na lista de contatos antes de ligar."
      );

      return;

    }


    if (
      selectedUser === username
    ) {

      alert(
        "Você não pode ligar para você mesmo."
      );

      return;

    }


    if (peerConnection) {

      alert(
        "Você já está em uma chamada."
      );

      return;

    }


    try {

      currentCallTarget =
        selectedUser;

      currentCallIsVideo =
        hasVideo;


      callModal
        .classList
        .remove("hidden");


      btnAcceptCall
        .classList
        .add("hidden");


      callPeerName.textContent =
        `Chamando ${selectedUser}...`;


      callStateText.textContent =
        hasVideo
          ? "Chamada de vídeo..."
          : "Chamada de áudio...";


      localStream =
        await navigator.mediaDevices
          .getUserMedia({

            video:
              hasVideo,

            audio:
              true

          });


      localVideo.srcObject =
        localStream;


      peerConnection =
        new RTCPeerConnection(
          rtcConfig
        );


      localStream
        .getTracks()
        .forEach(
          track => {

            peerConnection.addTrack(
              track,
              localStream
            );

          }
        );


      peerConnection.ontrack =
        event => {

          remoteVideo.srcObject =
            event.streams[0];

          callStateText.textContent =
            "Conectado";

        };


      /*
       * Criamos a chamada FORA do chat.
       */

      const callsRef =
        ref(
          db,
          `calls/${safeKey(selectedUser)}`
        );


      const newCall =
        push(callsRef);


      currentCallId =
        newCall.key;


      currentCallRef =
        newCall;


      /*
       * ICE
       */

      peerConnection.onicecandidate =
        event => {

          if (
            event.candidate &&
            currentCallRef
          ) {

            push(
              ref(
                db,
                `calls/${safeKey(currentCallTarget)}/${currentCallId}/candidates`
              ),
              {
                from:
                  username,

                candidate:
                  event.candidate.toJSON(),

                createdAt:
                  Date.now()
              }
            );

          }

        };


      const offer =
        await peerConnection
          .createOffer();


      await peerConnection
        .setLocalDescription(
          offer
        );


      /*
       * A chamada contém:
       *
       * caller
       * targetUser
       * createdAt
       * offer
       */

      await set(
        currentCallRef,
        {

          caller:
            username,

          targetUser:
            selectedUser,

          hasVideo:
            hasVideo,

          offer:
            offer,

          createdAt:
            Date.now(),

          status:
            "ringing"

        }
      );


      /*
       * Escuta resposta da chamada.
       */

      listenCallAnswer();

    }

    catch (error) {

      console.error(
        error
      );

      alert(
        "Erro ao iniciar chamada: " +
        error.message
      );

      endCall();

    }

  }


  /* =====================================================
     ESCUTA CHAMADAS RECEBIDAS
     ===================================================== */

  let incomingCallsRef =
    null;


  function listenIncomingCalls() {

    /*
     * Cada usuário possui sua própria caixa
     * de chamadas.
     */

    incomingCallsRef =
      ref(
        db,
        `calls/${safeKey(username)}`
      );


    onChildAdded(
      incomingCallsRef,
      snapshot => {

        const data =
          snapshot.val();


        if (!data)
          return;


        /*
         * NÃO aceitar chamadas antigas.
         *
         * Essa é uma das correções principais.
         */

        if (
          !data.createdAt ||
          data.createdAt <
          sessionStartedAt
        ) {

          return;

        }


        if (
          data.status !== "ringing"
        ) {

          return;

        }


        if (
          data.targetUser !== username
        ) {

          return;

        }


        if (
          data.caller === username
        ) {

          return;

        }


        /*
         * Se já estiver em chamada,
         * não abre outra.
         */

        if (peerConnection)
          return;


        pendingIncomingCall = {

          callId:
            snapshot.key,

          ...data

        };


        showIncomingCall(
          pendingIncomingCall
        );

      }
    );

  }


  /* =====================================================
     MOSTRAR CHAMADA RECEBIDA
     ===================================================== */

  function showIncomingCall(
    call
  ) {

    callModal
      .classList
      .remove("hidden");


    callPeerName.textContent =
      `${call.caller} está ligando`;


    callStateText.textContent =
      call.hasVideo
        ? "Chamada de vídeo"
        : "Chamada de áudio";


    btnAcceptCall
      .classList
      .remove("hidden");

  }


  /* =====================================================
     ACEITAR CHAMADA
     ===================================================== */

  async function acceptCall() {

    if (
      !pendingIncomingCall
    )
      return;


    try {

      const call =
        pendingIncomingCall;


      currentCallId =
        call.callId;


      currentCallTarget =
        call.caller;


      currentCallIsVideo =
        call.hasVideo;


      currentCallRef =
        ref(
          db,
          `calls/${safeKey(username)}/${currentCallId}`
        );


      btnAcceptCall
        .classList
        .add("hidden");


      callStateText.textContent =
        "Conectando...";


      localStream =
        await navigator.mediaDevices
          .getUserMedia({

            video:
              call.hasVideo,

            audio:
              true

          });


      localVideo.srcObject =
        localStream;


      peerConnection =
        new RTCPeerConnection(
          rtcConfig
        );


      localStream
        .getTracks()
        .forEach(
          track => {

            peerConnection.addTrack(
              track,
              localStream
            );

          }
        );


      peerConnection.ontrack =
        event => {

          remoteVideo.srcObject =
            event.streams[0];

          callStateText.textContent =
            "Conectado";

        };


      /*
       * Envia candidatos para o chamador.
       */

      peerConnection.onicecandidate =
        event => {

          if (
            event.candidate
          ) {

            push(
              ref(
                db,
                `calls/${safeKey(username)}/${currentCallId}/candidates`
              ),
              {

                from:
                  username,

                candidate:
                  event.candidate.toJSON(),

                createdAt:
                  Date.now()

              }
            );

          }

        };


      const offer =
        new RTCSessionDescription(
          call.offer
        );


      await peerConnection
        .setRemoteDescription(
          offer
        );


      const answer =
        await peerConnection
          .createAnswer();


      await peerConnection
        .setLocalDescription(
          answer
        );


      /*
       * Salva resposta.
       */

      await update(
        currentCallRef,
        {

          answer:
            answer,

          status:
            "accepted"

        }
      );


      /*
       * Escuta candidatos do chamador.
       */

      listenIncomingCandidates(
        username,
        currentCallId
      );


      pendingIncomingCall =
        null;

    }

    catch (error) {

      console.error(
        error
      );

      alert(
        "Erro ao aceitar chamada: " +
        error.message
      );

      endCall();

    }

  }


  /* =====================================================
     RESPOSTA DA CHAMADA
     ===================================================== */

  function listenCallAnswer() {

    if (!currentCallRef)
      return;


    onValue(
      currentCallRef,
      async snapshot => {

        const data =
          snapshot.val();


        if (!data)
          return;


        if (
          data.answer &&
          peerConnection &&
          !peerConnection.currentRemoteDescription
        ) {

          try {

            await peerConnection
              .setRemoteDescription(
                new RTCSessionDescription(
                  data.answer
                )
              );


            callStateText.textContent =
              "Conectando...";

          }

          catch (error) {

            console.error(
              "Erro ao aplicar answer:",
              error
            );

          }

        }

      }
    );


    listenIncomingCandidates(
      currentCallTarget,
      currentCallId
    );

  }


  /* =====================================================
     ICE
     ===================================================== */

  let candidateListeners = [];


  function listenIncomingCandidates(
    owner,
    callId
  ) {

    const candidatesRef =
      ref(
        db,
        `calls/${safeKey(owner)}/${callId}/candidates`
      );


    onChildAdded(
      candidatesRef,
      async snapshot => {

        const data =
          snapshot.val();


        if (
          !data ||
          !data.candidate
        )
          return;


        if (
          data.from === username
        )
          return;


        if (!peerConnection)
          return;


        try {

          await peerConnection
            .addIceCandidate(
              new RTCIceCandidate(
                data.candidate
              )
            );

        }

        catch (error) {

          console.warn(
            "ICE:",
            error
          );

        }

      }
    );


    candidateListeners.push(
      candidatesRef
    );

  }


  /* =====================================================
     ENCERRAR CHAMADA
     ===================================================== */

  async function endCall() {

    try {

      if (currentCallRef) {

        await update(
          currentCallRef,
          {
            status:
              "ended",
            endedAt:
              Date.now()
          }
        );

      }

    }

    catch (error) {

      console.warn(
        error
      );

    }


    if (peerConnection) {

      peerConnection.ontrack =
        null;

      peerConnection.onicecandidate =
        null;

      peerConnection.close();

      peerConnection =
        null;

    }


    if (localStream) {

      localStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

      localStream =
        null;

    }


    localVideo.srcObject =
      null;

    remoteVideo.srcObject =
      null;


    currentCallId =
      null;

    currentCallRef =
      null;

    currentCallTarget =
      null;

    pendingIncomingCall =
      null;


    btnAcceptCall
      .classList
      .add("hidden");


    callModal
      .classList
      .add("hidden");


    callStateText.textContent =
      "Conectando...";

  }


  /* =====================================================
     SEGURANÇA PARA NOMES DO FIREBASE
     ===================================================== */

  function safeKey(
    value
  ) {

    return String(value)
      .replace(/[.#$[\]/]/g, "_");

  }

</script>
